name: CI

# Tests every service, checks the configuration (env files, compose, nginx) and builds the images.
# On main, a green CI triggers the CD workflow (cd.yml).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Configuration
  # Nothing has a default value: settings live only in .env files. A variable read by the code but
  # missing from an example or test file would only show up as a service refusing to start.
  config:
    name: Configuration (env files, compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Env files list every variable the code reads
        run: bash .github/scripts/check-env-keys.sh

      - name: docker compose (development) resolves with the example env files
        run: |
          cp .env.example .env
          cp backend/.env.example backend/.env
          cp "Ai System/.env.example" "Ai System/.env"
          docker compose config --quiet

      - name: docker-compose.prod.yml resolves with the production examples
        run: |
          cp terraform/env/backend.env.example backend.env
          touch frontend.env
          docker compose -f docker-compose.prod.yml --env-file terraform/env/root.env.example config --quiet

  # ---------------------------------------------------------------- Backend
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: growtrack_testing # database of the backend tests (backend/src/test/resources/test.env)
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: "12345"
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Build & test (JUnit, against PostgreSQL)
        run: mvn -B verify

  # ---------------------------------------------------------------- Frontend
  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        continue-on-error: true # TODO: make blocking once the existing lint errors are fixed
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npx vitest run

      - name: Build
        run: npm run build

  # ---------------------------------------------------------------- AI System
  ai-system:
    name: AI System (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Ai System
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Ai System/requirements.txt

      - run: pip install -r requirements.txt pip-audit

      - name: Tests (pytest)
        run: python -m pytest -q

      - name: Known vulnerabilities (pip-audit)
        # diskcache (pulled in by instructor) has an advisory without a fixed release yet
        continue-on-error: true
        run: pip-audit -r requirements.txt

  # ---------------------------------------------------------------- Docker
  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [config, backend, frontend, ai-system]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: scrumflow-backend
            context: ./backend
          - image: scrumflow-frontend
            context: ./frontend
            target: prod
          - image: scrumflow-ai
            context: ./Ai System
          - image: scrumflow-nginx
            context: ./frontend/nginx
          - image: scrumflow-prometheus
            context: ./monitoring/prometheus
          - image: scrumflow-grafana
            context: ./monitoring/grafana
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: false
          # The gateway, the AI service and the monitoring images are also checked below
          load: ${{ contains(fromJSON('["scrumflow-nginx", "scrumflow-ai", "scrumflow-prometheus", "scrumflow-grafana"]'), matrix.image) }}
          tags: ${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: nginx config is valid (HTTP, and HTTPS with a test certificate)
        if: matrix.image == 'scrumflow-nginx'
        run: |
          # The upstream names must resolve for nginx -t
          hosts="--add-host frontend:127.0.0.1 --add-host backend:127.0.0.1 --add-host ai-system:127.0.0.1"

          docker run --rm $hosts scrumflow-nginx:ci nginx -t

          domain=scrumflow.example
          mkdir -p "le/live/$domain"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=$domain" \
            -keyout "le/live/$domain/privkey.pem" -out "le/live/$domain/fullchain.pem"
          out=$(docker run --rm $hosts -e TLS_DOMAIN=$domain -v "$PWD/le:/etc/letsencrypt:ro" \
            scrumflow-nginx:ci nginx -t 2>&1)
          echo "$out"
          grep -q "serving HTTPS for $domain" <<<"$out"
          grep -q "test is successful" <<<"$out"

      - name: Prometheus config and alert rules are valid
        if: matrix.image == 'scrumflow-prometheus'
        run: docker run --rm --entrypoint promtool scrumflow-prometheus:ci check config /etc/prometheus/prometheus.yml

      - name: Grafana starts and provisions the datasource and the dashboard
        if: matrix.image == 'scrumflow-grafana'
        run: |
          docker run -d --name grafana -p 3000:3000 -e GF_SECURITY_ADMIN_PASSWORD=ci-password             -e GF_SERVER_ROOT_URL=http://localhost:3000/grafana/ scrumflow-grafana:ci
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/grafana/api/health >/dev/null && break
            sleep 2
          done
          docker logs grafana 2>&1 | grep -iE "error|provision" | tail -20 || true
          curl -sf -u admin:ci-password http://localhost:3000/grafana/api/datasources/uid/prometheus | jq -e '.type == "prometheus"'
          curl -sf -u admin:ci-password http://localhost:3000/grafana/api/dashboards/uid/scrumflow-platform             | jq -e '.dashboard.title == "ScrumFlow Platform" and (.dashboard.panels | length) > 40'

      - name: AI service starts and reports healthy
        if: matrix.image == 'scrumflow-ai'
        run: |
          docker run -d --name ai -e AI_CORS_ALLOWED_ORIGINS= scrumflow-ai:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' ai)
            [ "$status" = healthy ] && break
            [ "$status" = unhealthy ] && break
            sleep 2
          done
          docker logs ai
          echo "health: $status"
          [ "$status" = healthy ]

  # ---------------------------------------------------------------- Terraform
  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
