
# ==========================================
# DEVELOPMENT OVERRIDES
# Active by default when running `docker-compose up`
# ==========================================

services:
  nginx:
    restart: unless-stopped
    ports:
      - "8080:80"   # The central gateway exposed to Port 8080 for dev
    volumes:
      - ./frontend/nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro

  db:
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${DB_DATABASE:?set DB_DATABASE in .env}
      POSTGRES_USER: ${DB_USERNAME:?set DB_USERNAME in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}

  backend:
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    # Container wiring, over backend/.env: the database container, its credentials (root .env, shared
    # with the db service above) and the storage volume
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:?set DB_DATABASE in .env}
      - DB_USERNAME=${DB_USERNAME:?set DB_USERNAME in .env}
      - DB_PASSWORD=${DB_PASSWORD:?set DB_PASSWORD in .env}
      - STORAGE_PATH=/app/storage
    volumes:
      - backend_storage:/app/storage

  frontend:
    build:
      target: dev
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      - VITE_API_URL=http://localhost:8080
      - VITE_AI_SERVICE_URL=http://localhost:8080/ai
    volumes:
      - ./frontend:/app
      - /app/node_modules

  prometheus:
    restart: unless-stopped
    ports:
      - "9090:9090"

  grafana:
    restart: unless-stopped

  ai-system:
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ./Ai System/.env
    volumes:
      - "./Ai System:/app"

volumes:
  backend_storage:
