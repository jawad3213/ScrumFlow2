# Routes shared by the HTTP server (default.conf) and the HTTPS server (https.conf.template).

# --- PART 1 : FRONTEND (React) ---
location / {
    proxy_pass http://frontend:80;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- PART 2 : BACKEND (Spring Boot API on 8000) ---
location /api {
    proxy_pass http://backend:8000;
    client_max_body_size 25m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Login, sign-up and password reset: rate limited (zone "auth" in 00-rate-limits.conf).
# A burst of 5 quick attempts is allowed, then about one every 6 seconds.
location ~ ^/api/(login|register|auth/google|auth/google/register|forgot-password|reset-password)$ {
    limit_req zone=auth burst=5 nodelay;
    error_page 429 = @too_many_requests;
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location @too_many_requests {
    default_type application/json;
    return 429 '{"message":"Trop de tentatives. Veuillez réessayer dans une minute."}';
}

# Uploaded files (avatars), served by the backend
location /storage/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- PART 3 : AI SYSTEM (Python) ---
# Only logged-in users: every call is checked against the backend first (see /_auth).
location /ai/ {
    auth_request /_auth;
    client_max_body_size 20m;
    proxy_pass http://ai-system:8001/;
    proxy_read_timeout 300s;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The AI service's Prometheus metrics are for the internal scraper only
location = /ai/metrics {
    return 404;
}

# Bearer token check for /ai/: the backend answers 200 for a valid token, 401 otherwise.
location = /_auth {
    internal;
    proxy_pass http://backend:8000/api/me;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# --- PART 4 : MONITORING (Grafana, behind its own login) ---
# The upstream is resolved per request (Docker DNS), so the site keeps working when the
# monitoring containers are stopped: /grafana/ then answers 502.
location /grafana/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $grafana_upstream http://grafana:3000;
    proxy_pass $grafana_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Grafana Live (WebSocket)
location /grafana/api/live/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $grafana_upstream http://grafana:3000;
    proxy_pass $grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Grafana sign-in: same rate limit as the application's login (zone "auth")
location = /grafana/login {
    limit_req zone=auth burst=5 nodelay;
    error_page 429 = @too_many_requests;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $grafana_upstream http://grafana:3000;
    proxy_pass $grafana_upstream;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Optimizations
location = /favicon.ico { access_log off; log_not_found off; }
location = /robots.txt  { access_log off; log_not_found off; }
