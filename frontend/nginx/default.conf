# HTTP only. Replaced by https.conf.template once TLS_DOMAIN is set and its certificate exists
# (see 40-scrumflow-tls.sh).
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 challenge files, written by the certbot container
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    include /etc/nginx/snippets/scrumflow-locations.conf;
}
