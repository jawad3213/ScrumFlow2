# Connection and request counters for the Prometheus nginx exporter (monitoring).
# Port 8080 is never published by docker compose: only containers on the Docker network reach it.
server {
    listen 8080;
    server_name _;
    access_log off;

    location = /stub_status {
        stub_status;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / {
        return 404;
    }
}
